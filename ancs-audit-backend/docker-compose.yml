version: "3.9"

# ============================================================
# ANCS — Stack de développement local (Optimisée)
# ============================================================
# Services :
#   - postgres    : PostgreSQL 16
#   - minio       : Stockage objet (preuves, rapports)
#   - pgadmin     : Interface d'administration PostgreSQL
#
# NOTE: Les services Ollama et Backend sont commentés pour
# économiser les ressources car ils tournent en local sur l'hôte.
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: ancs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ancs_audit}
      POSTGRES_USER: ${POSTGRES_USER:-ancs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ancs_secret_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ancs_user} -d ${POSTGRES_DB:-ancs_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ancs-network

  minio:
    image: minio/minio:latest
    container_name: ancs_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ancs_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ancs_minio_secret_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ancs-network

  minio-init:
    image: minio/mc:latest
    container_name: ancs_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set ancs http://minio:9000 ${MINIO_ROOT_USER:-ancs_minio_admin} ${MINIO_ROOT_PASSWORD:-ancs_minio_secret_dev};
      mc mb --ignore-existing ancs/ancs-rapports;
      mc mb --ignore-existing ancs/ancs-preuves;
      mc policy set private ancs/ancs-rapports;
      mc policy set private ancs/ancs-preuves;
      echo 'Buckets MinIO initialisés.';
      "
    networks:
      - ancs-network

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ancs_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   networks:
  #     - ancs-network

  # ollama-pull:
  #   image: ollama/ollama:latest
  #   container_name: ancs_ollama_pull
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   entrypoint: >
  #     /bin/sh -c "
  #     ollama pull qwen2.5-coder:3b;
  #     echo 'Modèle Qwen téléchargé.';
  #     "
  #   environment:
  #     OLLAMA_HOST: http://ollama:11434
  #   networks:
  #     - ancs-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ancs_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ancs.gov.tn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-ancs_pgadmin_dev}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ancs-network

  # backend:
  #   build:
  #     context: .
