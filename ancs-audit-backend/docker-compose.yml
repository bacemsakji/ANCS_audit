volumes:
  postgres_data:
    name: ancs_postgres_data
  minio_data:
    name: ancs_minio_data
  # ollama_data:
  #   name: ancs_ollama_data
  pgadmin_data:
    name: ancs_pgadmin_data

networks:
  ancs-network:
    name: ancs-network
    driver: bridge
