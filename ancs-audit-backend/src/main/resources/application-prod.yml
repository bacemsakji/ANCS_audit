# ============================================================
# Profil PROD — surcharge application.yml
# ============================================================
# IMPORTANT : Ne jamais commiter ce fichier avec des valeurs
# réelles. Toutes les propriétés sensibles sont injectées via
# les variables d'environnement au démarrage.
# ============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ancs_audit}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${POSTGRES_USER:ancs_user}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${POSTGRES_PASSWORD:ancs_secret_dev}}}
    hikari:
      pool-name: AncsHikariPool-Prod
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # Flyway gère le DDL, Hibernate valide seulement

  flyway:
    clean-disabled: true  # JAMAIS de flyway:clean en production

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: 900000   # 15 min en production
  refresh-token-expiration-ms: 604800000

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:ancs_minio_admin}
  secret-key: ${MINIO_SECRET_KEY:ancs_minio_secret_dev}

ai:
  provider: ${AI_PROVIDER:ollama}
  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${AI_OLLAMA_MODEL:qwen2.5-coder:3b}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account-dev.json}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    tn.gov.ancs: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
