# ============================================================
# Profil PROD — surcharge application.yml
# ============================================================
# IMPORTANT : Ne jamais commiter ce fichier avec des valeurs
# réelles. Toutes les propriétés sensibles sont injectées via
# les variables d'environnement au démarrage.
# ============================================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: AncsHikariPool-Prod
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # Flyway gère le DDL, Hibernate valide seulement

  flyway:
    clean-disabled: true  # JAMAIS de flyway:clean en production

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000   # 15 min en production
  refresh-token-expiration-ms: 604800000

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

ai:
  provider: ${AI_PROVIDER:ollama}
  ollama:
    base-url: ${AI_OLLAMA_BASE_URL}
    model: ${AI_OLLAMA_MODEL:qwen2.5-coder:3b}

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

logging:
  level:
    tn.gov.ancs: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
