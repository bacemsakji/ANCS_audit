# ============================================================
# Render Blueprint — Monorepo Configuration
# ============================================================

version: "1"

services:
  - type: web
    name: ancs-audit-backend
    env: docker
    rootDir: ancs-audit-backend
    dockerfilePath: Dockerfile
    context: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_HOST
        fromDatabase:
          name: ancs-audit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ancs-audit-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ancs-audit-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ancs-audit-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ancs-audit-db
          property: password

databases:
  - name: ancs-audit-db
    databaseName: ancs_audit
    user: ancs_user
    plan: free
