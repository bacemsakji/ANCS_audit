name: ancs_audit_mobile
description: "Application mobile officielle d'audit de sécurité SI — Agence Nationale de Cybersécurité (ANCS) de Tunisie"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Gestion d'état ---
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # --- Routage ---
  go_router: ^14.2.1

  # --- Réseau & Cache ---
  dio: ^5.5.0
  dio_cache_interceptor: ^3.5.0
  connectivity_plus: ^6.0.3

  # --- Stockage local offline (Drift/SQLite) ---
  drift: ^2.18.0
  # sqlite3_flutter_libs fournit les binaires SQLite natifs pour Android, iOS et Windows.
  # Sans cette dépendance, NativeDatabase ne peut pas s'initialiser sur mobile.
  sqlite3_flutter_libs: ^0.5.24
  # path_provider résout le chemin du répertoire de documents de l'application sur
  # chaque plateforme native (getApplicationDocumentsDirectory).
  path_provider: ^2.1.4
  # path fournit p.join() pour construire des chemins de fichiers cross-platform.
  path: ^1.9.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2

  # --- Internationalisation ---
  intl: ^0.20.2

  # --- Interface utilisateur & Design system ---
  # google_fonts gère le téléchargement des polices Inter et Noto dynamiquement —
  # cela évite de packager des fichiers .ttf dans les assets et supprime les
  # erreurs de build dues aux fichiers manquants.
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Générateurs de code ---
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  
  # --- Testing ---
  mockito: ^5.4.4
  mocktail: ^1.0.2

flutter:
  uses-material-design: true
  generate: true # Active la génération de fichiers l10n automatique

  assets:
    - assets/images/
